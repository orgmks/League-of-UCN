<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>League Of UCN - Campeones del LOL a la palma de tu mano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="fondo" aria-hidden="true"></canvas>
  <div class="progreso" id="progreso"></div>

  <section class="hero" id="hero">
    <div class="hero-fondos" id="heroFondos" aria-hidden="true">
      <div class="hero-bg"></div>
      <div class="hero-bg"></div>
    </div>
    <img class="logo-ucn" id="logoUcn" src="assets/logo-ucn.png" alt="Logo Universidad Católica del Norte">
    <div class="hero-texto">
      <p class="etiqueta entrada" style="--d:.1s">Guia de Campeones</p>
      <h1 class="entrada" style="--d:.3s">League Of UCN</h1>
      <p class="entrada sub" style="--d:.6s">Solo para aficionados a el LOL</p>
      <a href="#controles" class="btn entrada" style="--d:.9s">BUSCAR CAMPEON</a>
    </div>
    </section>

  <main class="contenedor">
    <div class="controles" id="controles">
      <input type="search" id="busca" placeholder="Buscar campeón…" aria-label="Buscar campeón">
      <div class="roles" id="roles" role="group" aria-label="Filtrar por rol"></div>
      <label class="orden">Ordenar por
        <select id="orden">
          <option value="nombre">Nombre</option>
          <option value="hp">Más vida</option>
          <option value="ad">Más daño base</option>
          <option value="dificultad">Más difícil</option>
        </select>
      </label>
    </div>
    <p class="conteo" id="conteo" aria-live="polite">Cargando campeones…</p>
    <div class="grid" id="grid"></div>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="mNombre">
      <button class="cerrar" id="cerrar" aria-label="Cerrar">×</button>
      <img id="mImg" alt="">
      <div class="modal-info">
        <h2 id="mNombre"></h2>
        <p class="m-titulo" id="mTitulo"></p>
        <div class="chips" id="mRoles"></div>
        <p class="m-desc" id="mDesc"></p>
        <label class="nivel">Nivel <b id="nivelTxt">1</b>
          <input type="range" id="nivel" min="1" max="18" value="1">
        </label>
        <dl class="m-stats" id="mStats"></dl>
      </div>
    </div>
  </div>

  <footer class="pie">
    <p>Bibliografia : Data Dragon</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
